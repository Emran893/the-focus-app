name: Build The Focus Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Dummy web assets directory banana zaroori hai taaki Capacitor error na de
      - name: Create Dummy Web Assets Directory
        run: mkdir -p dist && echo "<html><body>Lovable Wrapper</body></html>" > dist/index.html

      # Aapke project ke packages aur hmare dwara add kiya gaya typescript install hoga
      - name: Install dependencies
        run: npm install

      # Npx cap add aur sync ko sahi sequence me chalane ke liye setup script
      - name: Initialize Android Platform
        run: |
          npx cap add android || echo "Android folder might already exist or skipped"
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Focus-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
