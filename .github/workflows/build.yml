name: Build The Focus Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Java files
        run: |
          cp android-fixes/MainActivity.java android/app/src/main/java/com/thefocuslive/app/MainActivity.java
          cp android-fixes/SplashActivity.java android/app/src/main/java/com/thefocuslive/app/SplashActivity.java

      - name: Copy splash layout
        run: |
          mkdir -p android/app/src/main/res/layout
          cp android-fixes/res/layout/activity_splash.xml android/app/src/main/res/layout/

      - name: Copy animations
        run: |
          mkdir -p android/app/src/main/res/anim
          cp android-fixes/res/anim/slide_in_right.xml android/app/src/main/res/anim/

      - name: Copy boot video to raw resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/boot_video.mp4 android/app/src/main/res/raw/boot_video.mp4
          echo "Boot video copied: $(du -sh android/app/src/main/res/raw/boot_video.mp4)"

      - name: Fix icons - high quality
        run: |
          cp assets/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp assets/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp assets/icon_144.png    android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon_144.png    android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp assets/icon_144.png    android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp assets/icon_96.png     android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon_96.png     android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp assets/icon_96.png     android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp assets/icon_72.png     android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon_72.png     android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp assets/icon_72.png     android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp assets/icon_48.png     android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon_48.png     android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp assets/icon_48.png     android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          sed -i 's/#[0-9a-fA-F]*/\#000000/' android/app/src/main/res/values/ic_launcher_background.xml
          echo "Icons done"

      - name: Update AndroidManifest for SplashActivity
        run: |
          python3 << 'PYEOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              c = f.read()
          if 'SplashActivity' not in c:
              splash = '''
              <activity
                  android:name=".SplashActivity"
                  android:exported="true"
                  android:screenOrientation="portrait"
                  android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                  android:theme="@style/AppTheme.NoActionBar">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>'''
              c = re.sub(
                  r'<intent-filter>\s*<action android:name="android\.intent\.action\.MAIN"[^>]*/>\s*<category android:name="android\.intent\.category\.LAUNCHER"[^>]*/>\s*</intent-filter>',
                  '', c
              )
              c = c.replace('</application>', splash + '\n    </application>')
              with open(path, 'w') as f:
                  f.write(c)
              print('Manifest updated')
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Focus-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
