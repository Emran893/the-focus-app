name: Build The Focus Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy MainActivity
        run: cp android-fixes/MainActivity.java android/app/src/main/java/com/thefocuslive/app/MainActivity.java

      - name: Copy SplashActivity
        run: cp android-fixes/SplashActivity.java android/app/src/main/java/com/thefocuslive/app/SplashActivity.java

      - name: Copy splash layout
        run: |
          mkdir -p android/app/src/main/res/layout
          cp android-fixes/res/layout/activity_splash.xml android/app/src/main/res/layout/

      - name: Copy animations
        run: |
          mkdir -p android/app/src/main/res/anim
          cp android-fixes/res/anim/logo_flip.xml android/app/src/main/res/anim/
          cp android-fixes/res/anim/logo_zoom.xml android/app/src/main/res/anim/

      - name: Update AndroidManifest for SplashActivity
        run: |
          python3 << 'PYEOF'
          import re
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          splash = '''
              <activity
                  android:name=".SplashActivity"
                  android:exported="true"
                  android:theme="@style/AppTheme.NoActionBar">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>'''
          content = re.sub(
              r'<intent-filter>\s*<action android:name="android\.intent\.action\.MAIN"[^>]*/>\s*<category android:name="android\.intent\.category\.LAUNCHER"[^>]*/>\s*</intent-filter>',
              '',
              content
          )
          content = content.replace('</application>', splash + '\n    </application>')
          with open(manifest_path, 'w') as f:
              f.write(content)
          print('Manifest updated')
          PYEOF

      - name: Fix icons - replace adaptive icons with plain PNG
        run: |
          # Copy our logo to all mipmap sizes
          cp assets/icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp assets/icon_192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp assets/icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp assets/icon_144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp assets/icon_96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon_96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp assets/icon_96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp assets/icon_72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon_72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp assets/icon_72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp assets/icon_48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon_48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp assets/icon_48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png

          # Replace adaptive icon XMLs with simple PNG references (fixes ic_launcher_foreground not found error)
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XMLEOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XMLEOF

          # Make sure color resource exists
          mkdir -p android/app/src/main/res/values
          if ! grep -q "ic_launcher_background" android/app/src/main/res/values/colors.xml 2>/dev/null; then
            echo '<resources><color name="ic_launcher_background">#CC0000</color></resources>' > android/app/src/main/res/values/ic_launcher_colors.xml
          fi

          echo "Icons fixed successfully"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Focus-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
